name: gates

# 手元同等確認用。Actions 課金を増やさないため pull_request / push では起動しない。
# 開発保証の正本は repository-guarantees.yml（同じく workflow_dispatch のみ）。
# 本 WF は tools/run_repo_preflight.py 経由の経路を残す。

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install pinned ai-ratchet-gate wheel
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r requirements-tools.txt
      - name: Empty-diff fail-closed
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$DEFAULT_BRANCH"
          BASE="$(git rev-parse "origin/${DEFAULT_BRANCH}")"
          HEAD="$(git rev-parse HEAD)"
          if [ "$BASE" = "$HEAD" ]; then
            echo "空diff fail-closed: workflow_dispatch で BASE==HEAD ($HEAD)" >&2
            exit 1
          fi
          echo "BASE=$BASE HEAD=$HEAD"
      - name: ai-ratchet-gate
        run: python -m ai_ratchet_gate --repo .
      - name: repo-preflight via tools/run_repo_preflight.py
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          BASE_REF="origin/${DEFAULT_BRANCH}"
          python tools/run_repo_preflight.py --repo . --base-ref "$BASE_REF"
