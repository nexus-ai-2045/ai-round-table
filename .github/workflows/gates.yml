name: gates

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install ai-ratchet-gate from Release wheel
        run: |
          python -m pip install --upgrade pip
          python -m pip install https://github.com/nexus-ai-2045/ai-ratchet-gate/releases/download/v0.1.1/ai_ratchet_gate-0.1.1-py3-none-any.whl
      - name: Checkout repo-preflight (upstream, no logic copy)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: nexus-ai-2045/repo-preflight
          path: .tools/repo-preflight
      - name: ai-ratchet-gate
        run: ai-ratchet-gate --repo .
      - name: repo-preflight (shadow consistency + readiness evidence)
        run: |
          BASE_REF="origin/${{ github.event.pull_request.base.ref || 'main' }}"
          python tools/run_repo_preflight.py --repo . --base-ref "$BASE_REF"
